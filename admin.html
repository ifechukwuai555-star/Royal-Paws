File: "admin.html"

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Royal Paws Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080808;
      color: #f5f5f5;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    .gold {
      color: #d4af37;
    }

    .hidden {
      display: none !important;
    }

    /* Login */
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at top, rgba(212, 175, 55, 0.14), transparent 40%),
        #080808;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 18px;
      background: #111;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      color: #d4af37;
      margin-bottom: 8px;
    }

    .login-subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ddd;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #080808;
      color: #fff;
      outline: none;
    }

    input:focus {
      border-color: #d4af37;
    }

    .login-button,
    .action-button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 700;
    }

    .login-button {
      width: 100%;
      margin-top: 18px;
      background: #d4af37;
      color: #080808;
    }

    .login-button:hover {
      background: #f0cf63;
    }

    .status-message {
      margin-top: 15px;
      text-align: center;
      color: #ff7777;
      min-height: 20px;
    }

    /* Dashboard */
    .dashboard {
      min-height: 100vh;
    }

    .topbar {
      border-bottom: 1px solid #252525;
      background: #0d0d0d;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      color: #d4af37;
      font-size: 24px;
      font-weight: 800;
    }

    .top-actions {
      display: flex;
      gap: 10px;
    }

    .action-button {
      background: #1c1c1c;
      color: #fff;
      border: 1px solid #333;
    }

    .action-button:hover {
      border-color: #d4af37;
    }

    .logout-button {
      color: #ff8b8b;
    }

    .container {
      width: min(1200px, 92%);
      margin: 30px auto;
    }

    .page-title {
      margin-bottom: 8px;
      font-size: 32px;
    }

    .page-description {
      color: #999;
      margin-bottom: 25px;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: #111;
      border: 1px solid #242424;
      border-radius: 15px;
      padding: 22px;
    }

    .stat-label {
      color: #999;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-number {
      color: #d4af37;
      font-size: 32px;
      font-weight: 800;
    }

    /* Filters */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-button {
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid #333;
      background: #111;
      color: #ccc;
      cursor: pointer;
    }

    .filter-button.active {
      background: #d4af37;
      color: #080808;
      border-color: #d4af37;
      font-weight: 700;
    }

    /* Inquiries */
    .inquiries {
      display: grid;
      gap: 15px;
    }

    .inquiry {
      background: #111;
      border: 1px solid #292929;
      border-radius: 15px;
      padding: 20px;
    }

    .inquiry.unread {
      border-color: rgba(212, 175, 55, 0.55);
    }

    .inquiry-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 15px;
    }

    .customer-name {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }

    .customer-contact {
      color: #999;
      font-size: 14px;
      margin-top: 5px;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .badge.unread {
      background: rgba(212, 175, 55, 0.16);
      color: #d4af37;
    }

    .badge.read {
      background: rgba(100, 200, 130, 0.12);
      color: #82d49a;
    }

    .message {
      background: #090909;
      border-radius: 10px;
      padding: 15px;
      color: #ddd;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 15px;
    }

    .inquiry-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .date {
      color: #777;
      font-size: 13px;
    }

    .inquiry-actions {
      display: flex;
      gap: 8px;
    }

    .small-button {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #191919;
      color: #ddd;
      cursor: pointer;
    }

    .small-button:hover {
      border-color: #d4af37;
    }

    .delete-button:hover {
      border-color: #d66;
      color: #ff8888;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      border: 1px dashed #333;
      border-radius: 15px;
      color: #888;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #aaa;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .topbar {
        padding: 15px;
      }

      .brand {
        font-size: 20px;
      }

      .top-actions {
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .page-title {
        font-size: 27px;
      }

      .inquiry-header {
        flex-direction: column;
      }

      .inquiry-footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <section id="loginPage" class="login-page">
    <div class="login-box">
      <div class="logo">Royal Paws</div>
      <p class="login-subtitle">Administrator Dashboard</p>

      <form id="loginForm">
        <label for="adminPassword">Admin Password</label>
        <input
          id="adminPassword"
          type="password"
          autocomplete="current-password"
          placeholder="Enter your admin password"
          required
        >

        <button class="login-button" type="submit">
          Login
        </button>

        <div id="loginStatus" class="status-message"></div>
      </form>
    </div>
  </section>

  <!-- DASHBOARD -->
  <section id="dashboard" class="dashboard hidden">

    <header class="topbar">
      <div class="brand">Royal Paws Admin</div>

      <div class="top-actions">
        <button id="refreshButton" class="action-button">
          Refresh
        </button>

        <button id="logoutButton" class="action-button logout-button">
          Logout
        </button>
      </div>
    </header>

    <main class="container">

      <h1 class="page-title">Customer Inquiries</h1>
      <p class="page-description">
        Manage messages submitted through the Royal Paws contact form.
      </p>

      <section class="stats">
        <div class="stat-card">
          <div class="stat-label">Total</div>
          <div id="totalCount" class="stat-number">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Unread</div>
          <div id="unreadCount" class="stat-number">0</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Read</div>
          <div id="readCount" class="stat-number">0</div>
        </div>
      </section>

      <div class="toolbar">
        <div class="filters">
          <button class="filter-button active" data-filter="all">
            All
          </button>

          <button class="filter-button" data-filter="unread">
            Unread
          </button>

          <button class="filter-button" data-filter="read">
            Read
          </button>
        </div>
      </div>

      <section id="inquiries" class="inquiries">
        <div class="loading">Loading inquiries...</div>
      </section>

    </main>
  </section>

  <script>
    const loginPage = document.getElementById('loginPage');
    const dashboard = document.getElementById('dashboard');
    const loginForm = document.getElementById('loginForm');
    const adminPassword = document.getElementById('adminPassword');
    const loginStatus = document.getElementById('loginStatus');

    const inquiriesContainer = document.getElementById('inquiries');
    const totalCount = document.getElementById('totalCount');
    const unreadCount = document.getElementById('unreadCount');
    const readCount = document.getElementById('readCount');

    const refreshButton = document.getElementById('refreshButton');
    const logoutButton = document.getElementById('logoutButton');

    const filterButtons = document.querySelectorAll('.filter-button');

    let inquiries = [];
    let currentFilter = 'all';

    function showLogin() {
      loginPage.classList.remove('hidden');
      dashboard.classList.add('hidden');
      adminPassword.value = '';
    }

    function showDashboard() {
      loginPage.classList.add('hidden');
      dashboard.classList.remove('hidden');
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatDate(value) {
      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return 'Unknown date';
      }

      return date.toLocaleString();
    }

    function updateStats() {
      const total = inquiries.length;
      const unread = inquiries.filter(item => item.status === 'unread').length;
      const read = inquiries.filter(item => item.status === 'read').length;

      totalCount.textContent = total;
      unreadCount.textContent = unread;
      readCount.textContent = read;
    }

    function renderInquiries() {
      updateStats();

      const filtered = inquiries.filter(item => {
        if (currentFilter === 'all') return true;
        return item.status === currentFilter;
      });

      if (filtered.length === 0) {
        inquiriesContainer.innerHTML = `
          <div class="empty">
            No ${currentFilter === 'all' ? '' : currentFilter + ' '}inquiries found.
          </div>
        `;
        return;
      }

      inquiriesContainer.innerHTML = filtered.map(item => {
        const phone = item.phone
          ? `<div>Phone: ${escapeHtml(item.phone)}</div>`
          : '';

        const actionText = item.status === 'unread'
          ? 'Mark Read'
          : 'Mark Unread';

        return `
          <article class="inquiry ${item.status === 'unread' ? 'unread' : ''}">
            <div class="inquiry-header">
              <div>
                <div class="customer-name">
                  ${escapeHtml(item.name)}
                </div>

                <div class="customer-contact">
                  <div>Email: ${escapeHtml(item.email)}</div>
                  ${phone}
                </div>
              </div>

              <span class="badge ${escapeHtml(item.status)}">
                ${escapeHtml(item.status)}
              </span>
            </div>

            <div class="message">
              ${escapeHtml(item.message)}
            </div>

            <div class="inquiry-footer">
              <div class="date">
                ${formatDate(item.created_at)}
              </div>

              <div class="inquiry-actions">
                <button
                  class="small-button"
                  data-action="toggle-status"
                  data-id="${escapeHtml(item.id)}"
                >
                  ${actionText}
                </button>

                <button
                  class="small-button delete-button"
                  data-action="delete"
                  data-id="${escapeHtml(item.id)}"
                >
                  Delete
                </button>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    async function checkSession() {
      try {
        const response = await fetch('/api/admin/session', {
          credentials: 'same-origin'
        });

        if (!response.ok) {
          showLogin();
          return;
        }

        const data = await response.json();

        if (data.authenticated) {
          showDashboard();
          await loadInquiries();
        } else {
          showLogin();
        }
      } catch (error) {
        showLogin();
      }
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      loginStatus.textContent = 'Logging in...';

      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'same-origin',
          body: JSON.stringify({
            password: adminPassword.value
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          loginStatus.textContent = data.message || 'Login failed.';
          return;
        }

        loginStatus.textContent = '';
        showDashboard();
        await loadInquiries();

      } catch (error) {
        loginStatus.textContent =
          'Unable to connect to the server.';
      }
    });

    async function loadInquiries() {
      inquiriesContainer.innerHTML =
        '<div class="loading">Loading inquiries...</div>';

      try {
        const response = await fetch('/api/admin/inquiries', {
          credentials: 'same-origin'
        });

        if (response.status === 401) {
          showLogin();
          return;
        }

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.message || 'Failed to load inquiries.');
        }

        inquiries = Array.isArray(data.inquiries)
          ? data.inquiries
          : [];

        renderInquiries();

      } catch (error) {
        inquiriesContainer.innerHTML = `
          <div class="empty">
            ${escapeHtml(error.message)}
          </div>
        `;
      }
    }

    async function updateStatus(id, status) {
      try {
        const response = await fetch(
          `/api/admin/inquiries/${encodeURIComponent(id)}`,
          {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json'
            },
            credentials: 'same-origin',
            body: JSON.stringify({ status })
          }
        );

        if (response.status === 401) {
          showLogin();
          return;
        }

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.message || 'Unable to update inquiry.');
        }

        await loadInquiries();

      } catch (error) {
        alert(error.message);
      }
    }

    async function deleteInquiry(id) {
      const confirmed = confirm(
        'Are you sure you want to delete this inquiry?'
      );

      if (!confirmed) {
        return;
      }

      try {
        const response = await fetch(
          `/api/admin/inquiries/${encodeURIComponent(id)}`,
          {
            method: 'DELETE',
            credentials: 'same-origin'
          }
        );

        if (response.status === 401) {
          showLogin();
          return;
        }

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.message || 'Unable to delete inquiry.');
        }

        await loadInquiries();

      } catch (error) {
        alert(error.message);
      }
    }

    inquiriesContainer.addEventListener('click', async (event) => {
      const button = event.target.closest('button[data-action]');

      if (!button) {
        return;
      }

      const id = button.dataset.id;
      const action = button.dataset.action;

      const inquiry = inquiries.find(
        item => String(item.id) === String(id)
      );

      if (!inquiry) {
        return;
      }

      if (action === 'toggle-status') {
        const newStatus =
          inquiry.status === 'unread' ? 'read' : 'unread';

        await updateStatus(id, newStatus);
      }

      if (action === 'delete') {
        await deleteInquiry(id);
      }
    });

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        currentFilter = button.dataset.filter;

        filterButtons.forEach(item => {
          item.classList.toggle(
            'active',
            item === button
          );
        });

        renderInquiries();
      });
    });

    refreshButton.addEventListener('click', async () => {
      await loadInquiries();
    });

    logoutButton.addEventListener('click', async () => {
      try {
        await fetch('/api/admin/logout', {
          method: 'POST',
          credentials: 'same-origin'
        });
      } finally {
        showLogin();
      }
    });

    checkSession();
  </script>

</body>
</html>
